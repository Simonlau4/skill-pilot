name: Platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Windows installation preflight
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_windows_update -v
      - name: Test
        run: python -m unittest discover -v
      - name: Check browser script
        run: node --check skill_pilot/web/static/app.js
